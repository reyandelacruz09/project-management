; Development container: workers inherit the root master user so bind-mounted
; storage stays writable regardless of the host user's uid/gid.
listen = 0.0.0.0:9000

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4